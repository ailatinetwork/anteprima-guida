<!doctype html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove dito · pressione del tasto</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#00602e;--lichen:#e6f0e3;--ink:#17241c;--ink-2:#3f5146;--ink-3:#5d6f63;--line:#dbe5d8;--call:#d96200;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:#f5f7f5;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{max-width:1240px;margin:0 auto;padding:24px 16px 4px}
h1{font-size:26px;line-height:1.15;margin:0 0 8px}
header p{margin:0 0 6px;color:var(--ink-2);max-width:70ch}
main{max-width:1240px;margin:0 auto;padding:14px 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.card{background:var(--paper);border-radius:18px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.stage{background:var(--lichen);padding:26px 14px 18px;display:grid;place-items:center}
.txt{padding:14px 18px 18px}
.txt h2{margin:0 0 4px;font-size:19px;display:flex;gap:10px;align-items:center}
.txt h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:14px}
.txt p{margin:0;color:var(--ink-2);font-size:15px}
.lbl{margin-top:12px;font-size:14px;color:var(--ink-2);height:20px}
.lbl b{color:#8a4300}
.term{position:relative;width:100%;max-width:360px;aspect-ratio:1204/632;user-select:none}
.term img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,30,15,.10)) drop-shadow(0 24px 30px rgba(0,40,20,.18))}
.disp{position:absolute;left:27.243%;top:29.114%;width:45.847%;height:43.671%;background:#00a3f7;border-radius:1%;display:grid;place-items:center;font:400 clamp(11px,3.4vw,20px) "Noto Sans",sans-serif;color:#0b1b2b}
.fill{position:absolute;width:7.6%;height:16.2%;transform:translate(-50%,-50%);border-radius:12%/11%;background:#ff8c1a;mix-blend-mode:multiply;opacity:0;pointer-events:none}
.key{position:absolute;width:7.973%;height:16.772%;transform:translate(-50%,-50%);border-radius:12%/11%}
.key > *{position:absolute;pointer-events:none;font-style:normal}
.ripple,.ripple2{left:50%;top:50%;width:94%;aspect-ratio:1;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
.ring{left:-14%;top:-12%;right:-14%;bottom:-12%;border-radius:22%;opacity:0;box-shadow:0 0 0 3px var(--call)}
.hold{left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-90deg);overflow:visible}
.hold circle{fill:none;stroke:var(--call);stroke-width:6;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;stroke-linecap:round}
/* A: disco scuro (com'è ora) */
.dot{left:50%;top:50%;width:118%;aspect-ratio:1;border-radius:50%;opacity:0;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(23,36,28,.32) 0,rgba(23,36,28,.26) 58%,rgba(23,36,28,.1) 84%,rgba(23,36,28,0) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),0 4px 10px rgba(0,20,10,.28)}
/* B: tocco come nelle registrazioni dello schermo dell'iPhone */
.touch{left:50%;top:50%;width:125%;aspect-ratio:1;border-radius:50%;opacity:0;transform:translate(-50%,-50%);background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),0 0 0 1.5px rgba(23,36,28,.28),0 6px 14px rgba(0,20,10,.25)}
/* C: dito disegnato che arriva dal basso */
.hand{left:50%;top:50%;width:150%;opacity:0;transform-origin:30% 4%}
.hand svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,20,10,.3))}
footer{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--ink-3);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Il dito che preme: quattro versioni</h1>
  <p>Ognuna ripete: un tocco su <b>Prg</b>, poi <b>Enter</b> tenuto premuto 3 secondi. Il velo arancione sul tasto è uguale in tutte. Le animazioni si vedono anche con «Riduci movimento» attivo. Scegli la lettera.</p>
</header>
<main id="grid"></main>
<footer>Pagina di prova per la scelta: non fa parte della guida.</footer>
<script>
const V = [
  { id: 'A', name: 'Disco scuro (com’è ora)', d: 'Disco grigio scuro con bordo bianco sopra il tasto. Per confronto.' },
  { id: 'B', name: 'Tocco come sull’iPhone', d: 'Cerchio bianco traslucido, come i tocchi nelle registrazioni dello schermo: arriva, schiaccia il tasto e si solleva. Il tasto arancione resta ben visibile sotto.' },
  { id: 'C', name: 'Dito disegnato', d: 'Una mano stilizzata entra dal basso e preme il tasto con la punta dell’indice, poi si ritira. È la più esplicita.' },
  { id: 'D', name: 'Senza dito', d: 'Niente dito: il tasto si colora, si abbassa e manda un’onda arancione; un bordo arancione resta durante la pressione.' }
];
const HAND = '<svg viewBox="0 0 60 84" aria-hidden="true"><path d="M22 6a7 7 0 0 1 14 0v30h3a6 6 0 0 1 6 3 6 6 0 0 1 6 3 6 6 0 0 1 7 6v14c0 12-9 21-21 21h-6c-9 0-15-5-19-12L3 56a6 6 0 0 1 9-7l10 9z" fill="#fff" stroke="#17241c" stroke-width="2.6" stroke-linejoin="round"/><path d="M36 36v12M45 42v8M51 45v7" fill="none" stroke="#17241c" stroke-width="2.2" stroke-linecap="round"/></svg>';
const KEYS = { PRG: [214, 313], ENTER: [988, 313] };
const SEQ = [{ k: 'PRG', t0: .5, hold: 0, after: 'Login' }, { k: 'ENTER', t0: 2.3, hold: 1.8, after: 'Main menu' }];
const LOOP = 6.4, A = .55, DOWN = .08;
const cards = V.map(v => {
  const c = document.createElement('article'); c.className = 'card';
  c.innerHTML = `<div class="stage"><div class="term"><img src="assets/terminale_2d.png" alt=""><div class="disp">Home</div></div><div class="lbl"></div></div><div class="txt"><h2><i>${v.id}</i>${v.name}</h2><p>${v.d}</p></div>`;
  const term = c.querySelector('.term'), fx = {};
  for (const [k, [x, y]] of Object.entries(KEYS)) {
    const L = (x / 1204 * 100) + '%', T = (y / 632 * 100) + '%';
    const fl = document.createElement('i'); fl.className = 'fill'; fl.style.left = L; fl.style.top = T; term.appendChild(fl);
    const d = document.createElement('div'); d.className = 'key'; d.style.left = L; d.style.top = T;
    d.innerHTML = `<i class="ring"></i><i class="ripple"></i><i class="ripple2"></i><svg class="hold" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" pathLength="100"/></svg><i class="dot"></i><i class="touch"></i><i class="hand">${HAND}</i>`;
    term.appendChild(d);
    fx[k] = { el: d, fill: fl, ...Object.fromEntries(['ring', 'ripple', 'ripple2', 'dot', 'touch', 'hand'].map(s => [s, d.querySelector('.' + s)])), hold: d.querySelector('.hold circle') };
  }
  document.getElementById('grid').appendChild(c);
  return { v: v.id, fx, disp: c.querySelector('.disp'), lbl: c.querySelector('.lbl') };
});
function base(u, hold) {
  const rel = A + DOWN + hold, o = {};
  if (u < A) { const k = 1 - (1 - u / A) ** 3; o.arr = k; o.finger = k; } else if (u < rel) { o.arr = 1; o.finger = 1; } else { const k = Math.min(1, (u - rel) / .25); o.arr = 1 - k; o.finger = 1 - k; }
  if (u < A) o.press = 0; else if (u < A + DOWN) o.press = 1 - (1 - (u - A) / DOWN) ** 2; else if (u < rel) o.press = 1; else { const x = u - rel; o.press = Math.max(0, Math.exp(-x * 13) * Math.cos(x * 30)); }
  const r = (u - A) / .5; o.r = r > 0 && r < 1 ? r : 0;
  const r2 = (u - A - .15) / .6; o.r2 = r2 > 0 && r2 < 1 ? r2 : 0;
  o.hold = hold && u >= A && u < rel + .25 ? Math.min(1, (u - A) / (hold + DOWN)) : 0;
  o.on = u >= 0 && u < rel + .4 ? Math.min(1, u / .18, (rel + .4 - u) / .25) : 0;
  o.pre = u < A ? u / A : 1;
  return o;
}
const S = (el, o) => Object.assign(el.style, o);
function draw(card, k, u, hold) {
  const f = card.fx[k], v = card.v, a = u >= 0 && u < A + DOWN + hold + 1 ? base(u, hold) : { arr: 0, finger: 0, press: 0, r: 0, r2: 0, hold: 0, on: 0, pre: 0 };
  const rip = (el, r, w, grow) => S(el, { opacity: r ? (.95 * (1 - r)).toFixed(3) : 0, transform: `translate(-50%,-50%) scale(${1 + grow * (1 - (1 - r) ** 3)})`, boxShadow: `0 0 0 ${w}px #d96200` });
  S(f.fill, { opacity: (a.on * (.7 + .3 * Math.max(a.pre >= 1 ? 1 : 0, a.press))).toFixed(3) });
  S(f.el, { transform: `translate(-50%,-50%) scale(${1 - .05 * a.press})` });
  S(f.hold, { opacity: a.hold > 0 ? 1 : 0, strokeDashoffset: 100 - a.hold * 100 });
  for (const s of ['dot', 'touch', 'hand', 'ring', 'ripple2']) S(f[s], { opacity: 0 });
  rip(f.ripple, a.r, 3.5, .6);
  if (v === 'A') S(f.dot, { opacity: (a.finger * .95).toFixed(3), transform: `translate(-50%,-50%) scale(${1.45 - .55 * a.arr})` });
  if (v === 'B') S(f.touch, { opacity: (a.finger * .95).toFixed(3), transform: `translate(-50%,-50%) scale(${(1.5 - .5 * a.arr) * (1 - .12 * a.press)})` });
  if (v === 'C') {
    // la punta dell'indice (30%, 4% del disegno) arriva sul centro del tasto partendo dal basso a destra
    const off = 1 - a.arr;
    S(f.hand, { opacity: Math.min(1, a.finger * 1.6).toFixed(3), transform: `translate(${-30 + off * 25}%, ${-4 + off * 55}%) scale(${1 - .06 * a.press})` });
  }
  if (v === 'D') { S(f.ring, { opacity: a.on.toFixed(3) }); rip(f.ripple, a.r, 4.5, .9); rip(f.ripple2, a.r2, 3, 1.4); }
}
const t0 = performance.now();
(function loop() {
  requestAnimationFrame(loop);
  const t = ((performance.now() - t0) / 1000) % LOOP;
  for (const c of cards) {
    let scr = 'Home', lbl = '';
    for (const e of SEQ) { const u = t - e.t0, rel = A + DOWN + e.hold; draw(c, e.k, u, e.hold); if (u >= rel) scr = e.after; if (u >= 0 && u < rel + .3) lbl = (e.hold ? 'Tieni premuto ' : 'Premi ') + `<b>${e.k === 'PRG' ? 'Prg' : 'Enter'}</b>`; }
    c.disp.textContent = scr; c.lbl.innerHTML = lbl;
  }
})();
</script>
</body>
</html>
